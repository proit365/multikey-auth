name: Publish Flutter SDK to pub.dev

on:
  push:
    tags:
      - 'flutter-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write

    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

    with:
      environment: pub.dev
      working-directory: packages/flutter

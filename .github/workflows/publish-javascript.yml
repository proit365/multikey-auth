name: Publish JavaScript SDK to npm

on:
  push:
    tags:
      - 'javascript-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm Trusted Publishing requirements
        run: |
          node -e "const [major,minor]=process.versions.node.split('.').map(Number); if(major<22||(major===22&&minor<14)){console.error('npm Trusted Publishing requires Node.js 22.14.0 or newer');process.exit(1)}"
          node -e "const [major,minor,patch]=require('child_process').execSync('npm --version',{encoding:'utf8'}).trim().split('.').map(Number); if(major<11||(major===11&&(minor<5||(minor===5&&patch<1)))){console.error('npm Trusted Publishing requires npm 11.5.1 or newer');process.exit(1)}"

      - name: Verify release tag and package version
        working-directory: packages/javascript
        run: |
          node -e "const p=require('./package.json'); if(p.name!=='@proit365/multikey-auth'){console.error('Unexpected npm package name: '+p.name);process.exit(1)} const v=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(p.version); if(!v){console.error('Package version must be X.Y.Z');process.exit(1)} const expected='javascript-v'+p.version; if(process.env.GITHUB_REF_NAME!==expected){console.error('Release tag '+process.env.GITHUB_REF_NAME+' does not match '+expected);process.exit(1)}"

      - name: Run JavaScript interoperability tests
        working-directory: packages/javascript
        run: npm test

      - name: Inspect npm package contents
        working-directory: packages/javascript
        run: npm pack --dry-run

      - name: Publish public package with npm Trusted Publishing
        working-directory: packages/javascript
        run: npm publish --access public --provenance
